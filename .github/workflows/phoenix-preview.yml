name: Phoenix Preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: phoenix-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/phoenix-journal-flow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply deterministic compile repairs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/Journal.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'await saveJournal(updated, currentUser);': 'await saveJournal(updated);',
              '.replaceAll("-", "")': '.replace(/-/g, "")',
              '{t.event}': '{t.label_event}',
              '{t.reflection}': '{t.label_reflection}',
              '{t.gratitude}': '{t.label_gratitude}',
              '{t.selfTalk}': '{t.label_selftalk}',
              '{t.angelNumbers}': '{t.label_angel}',
              '{t.dreams}': '{t.label_dreams}',
              '{t.notes}': '{language === "zh" ? "补充记录" : "Additional Notes"}',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/Journal.tsx
            git commit -m "fix: repair Phoenix journal TypeScript build"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and capture output
        id: build
        shell: bash
        run: |
          set +e
          npm run build -- --base=/InsightLoop/ > build.log 2>&1
          status=$?
          cat build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Post build output to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('build.log', 'utf8');
            const output = raw.length > 60000 ? raw.slice(-60000) : raw;
            const status = '${{ steps.build.outputs.status }}' === '0' ? '✅ Build passed' : '❌ Build failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ${status}\n\n\`\`\`text\n${output}\n\`\`\``
            });

      - name: Stop on build failure
        if: steps.build.outputs.status != '0'
        run: exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-preview-dist
          path: dist
          if-no-files-found: error

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
