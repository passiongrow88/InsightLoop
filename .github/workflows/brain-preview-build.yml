name: InsightLoop Brain Preview Build

on:
  push:
    branches:
      - agent/companion-preview-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build

      - name: Upload compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: insightloop-brain-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
