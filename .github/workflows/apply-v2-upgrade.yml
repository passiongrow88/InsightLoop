name: Apply InsightLoop V2 Upgrade

on:
  push:
    branches:
      - feature/v2-upgrade
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v2-upgrade
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2-upgrade
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "InsightLoop V2"
          git config user.email "dev@insightloop.lol"

      - name: Diagnose verified V2 payload
        shell: bash
        run: |
          set +e
          : > v2-payload-diagnostics.txt
          {
            echo "files:"
            ls -lah .bootstrap/v2chunks || true
            echo "raw character counts:"
            wc -c .bootstrap/v2chunks/chunk-* || true
            cat .bootstrap/v2chunks/chunk-* > /tmp/v2-payload.b64
            tr -d '\r\n\t ' < /tmp/v2-payload.b64 > /tmp/v2-payload.clean.b64
            echo "clean base64 characters: $(wc -c < /tmp/v2-payload.clean.b64)"
            base64 --decode /tmp/v2-payload.clean.b64 > /tmp/v2-payload.gz 2>/tmp/base64-error.txt
            echo "base64 status: $?"
            cat /tmp/base64-error.txt
            echo "decoded bytes: $(wc -c < /tmp/v2-payload.gz)"
            file /tmp/v2-payload.gz
            echo "first 32 bytes:"
            xxd -l 32 /tmp/v2-payload.gz
            echo "last 32 bytes:"
            tail -c 32 /tmp/v2-payload.gz | xxd
            gzip -t /tmp/v2-payload.gz 2>/tmp/gzip-error.txt
            echo "gzip status: $?"
            cat /tmp/gzip-error.txt
          } >> v2-payload-diagnostics.txt 2>&1
          git add v2-payload-diagnostics.txt
          git commit -m "ci: record V2 payload diagnostics"
          git push origin HEAD:feature/v2-upgrade
          exit 1
