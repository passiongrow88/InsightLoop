name: Enable InsightLoop Preview Site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-gh-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: insightloop-preview-site
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compiled preview
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy preview site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report verified live preview
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: `## ✅ Live Preview deployed\n\n${{ steps.deployment.outputs.page_url }}\n\nBuild and GitHub Pages deployment both completed successfully.`
            });
