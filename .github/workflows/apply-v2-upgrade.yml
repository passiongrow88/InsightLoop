name: Apply InsightLoop V2 Upgrade

on:
  push:
    branches:
      - feature/v2-upgrade
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v2-upgrade
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2-upgrade
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "InsightLoop V2"
          git config user.email "dev@insightloop.lol"

      - name: Reassemble verified V2 payload
        shell: bash
        run: |
          set -euxo pipefail
          cat .bootstrap/v2chunks/chunk-* > /tmp/v2-payload.b64
          tr -d '\r\n\t ' < /tmp/v2-payload.b64 | base64 --decode > /tmp/v2-payload.gz
          ls -lh /tmp/v2-payload.gz
          sha256sum /tmp/v2-payload.gz
          gzip -t /tmp/v2-payload.gz

      - name: Apply V2 payload
        shell: bash
        run: |
          set -euxo pipefail
          if tar -tzf /tmp/v2-payload.gz >/tmp/v2-tar-list.txt 2>/dev/null; then
            echo "Payload is a source archive"
            head -40 /tmp/v2-tar-list.txt
            tar -xzf /tmp/v2-payload.gz -C .
          else
            echo "Payload is a compressed git patch"
            gzip -dc /tmp/v2-payload.gz > /tmp/insightloop_v2.patch
            head -8 /tmp/insightloop_v2.patch
            git am --3way /tmp/insightloop_v2.patch
          fi

      - name: Remove bootstrap helpers
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f scripts/apply-v2-build.sh
          npm pkg delete scripts.prebuild || true
          rm -f .github/workflows/apply-v2-upgrade.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize V2 preview branch"
          fi

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Push upgraded branch
        run: git push origin HEAD:feature/v2-upgrade
