name: Phoenix Preview

on:
  push:
    branches:
      - feature/phoenix-journal-flow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phoenix-preview-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/InsightLoop/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Create self-contained preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist')
          html_path = root / 'index.html'
          html = html_path.read_text(encoding='utf-8')
          script_match = re.search(r'<script type="module" crossorigin src="([^"]+)"></script>', html)
          style_match = re.search(r'<link rel="stylesheet" crossorigin href="([^"]+)">', html)
          if not script_match or not style_match:
              raise SystemExit('Unable to locate Vite assets')
          js_name = script_match.group(1).rsplit('/', 1)[-1]
          css_name = style_match.group(1).rsplit('/', 1)[-1]
          js = (root / 'assets' / js_name).read_text(encoding='utf-8').replace('</script>', '<\\/script>')
          css = (root / 'assets' / css_name).read_text(encoding='utf-8').replace('</style>', '<\\/style>')
          html = re.sub(r'\s*<link rel="icon"[^>]*>', '', html)
          html = re.sub(r'\s*<link rel="apple-touch-icon"[^>]*>', '', html)
          html = html.replace(script_match.group(0), f'<script type="module">{js}</script>')
          html = html.replace(style_match.group(0), f'<style>{css}</style>')
          html_path.write_text(html, encoding='utf-8')
          print(html_path.stat().st_size)
          PY

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
